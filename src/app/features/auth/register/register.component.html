<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-text">✂ BARBERIA XPERIENCE</div>
      <div class="logo-sub">Crear Nueva Cuenta</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label-dark">Nombre</label>
          <input formControlName="firstName" class="form-control-dark" placeholder="Juan">
        </div>
        <div class="col-6">
          <label class="form-label-dark">Apellido</label>
          <input formControlName="lastName" class="form-control-dark" placeholder="Pérez">
        </div>
      </div>

      <div class="form-group mt-3">
        <label class="form-label-dark">Email</label>
        <input type="email" formControlName="email" class="form-control-dark" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label class="form-label-dark">Teléfono</label>
        <input formControlName="phoneNumber" class="form-control-dark" placeholder="+51 999 999 999">
      </div>

      <div class="form-group">
        <label class="form-label-dark">Contraseña</label>
        <input type="password" formControlName="password" class="form-control-dark" placeholder="Mínimo 8 caracteres">
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <div class="form-error">Mínimo 8 caracteres, una mayúscula y un número</div>
        }
      </div>

      @if (errorMessage()) {
        <div class="alert-error">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn-accent w-100 mt-2 btn-submit" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-2"></span>Registrando...
        } @else {
          <i class="bi bi-person-plus me-2"></i>Crear Cuenta
        }
      </button>
    </form>

    <div class="divider"></div>
    <p class="auth-footer-text">
      ¿Ya tienes cuenta? <a routerLink="/auth/login" class="text-accent">Iniciar Sesión</a>
    </p>
  </div>
</div>
